<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky control bar (route, cabin, program), then a month-by-month seat calendar. */
:root {
  --bg: #eef2f6;
  --surface: #ffffff;
  --ink: #142231;
  --muted: #5a6879;
  --line: #d6dde6;
  --accent: #1d5bb8;
  --rare: #e3a008;
  --rare-ink: #3d2b00;
  --rare-soft: #fbefcc;
  --match: #157a62;
  --match-soft: #d5eee6;
  --plain: #e3e8ee;
  --warn: #b9450e;
  --warn-soft: #fbe5d8;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c131b; --surface: #141f2c; --ink: #e5ecf4; --muted: #92a0b2; --line: #243345;
    --accent: #78a9ff; --rare: #f0b429; --rare-ink: #1d1500; --rare-soft: #3a2e0c;
    --match: #3cc39f; --match-soft: #113b31; --plain: #1c2938; --warn: #fb8c4a; --warn-soft: #3a1f10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c131b; --surface: #141f2c; --ink: #e5ecf4; --muted: #92a0b2; --line: #243345;
  --accent: #78a9ff; --rare: #f0b429; --rare-ink: #1d1500; --rare-soft: #3a2e0c;
  --match: #3cc39f; --match-soft: #113b31; --plain: #1c2938; --warn: #fb8c4a; --warn-soft: #3a1f10;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 var(--body);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.wrap {
  max-width: 760px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  background: var(--surface); z-index: 10;
}
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 12px 6px; }
h1 {
  margin: 0; font: 700 26px/1 var(--display); letter-spacing: 0.02em; text-transform: uppercase;
}
.updated { color: var(--muted); font-size: 13px; text-align: right; }

.routes {
  display: flex; gap: 6px; overflow-x: auto; padding-block: 6px 10px; scrollbar-width: none;
}
.routes::-webkit-scrollbar { display: none; }
.route {
  flex: none; display: flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--bg); border-radius: 999px;
  padding: 5px 12px; cursor: pointer;
  font: 600 17px/1.1 var(--display); letter-spacing: 0.04em;
}
.route[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.route .count {
  font: 500 11px/1 var(--mono); padding: 3px 5px; border-radius: 999px;
  background: var(--match-soft); color: var(--match);
}
.route .count.rare { background: var(--rare); color: var(--rare-ink); }
.route[aria-pressed="true"] .count { background: var(--surface); color: var(--ink); }

.controls { display: flex; gap: 8px; padding-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
.controls::-webkit-scrollbar { display: none; }
.seg { flex: none; display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button {
  border: 0; background: transparent; padding: 6px 10px; cursor: pointer; font-size: 13px; font-weight: 500;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }

/* Main */
main { display: flex; flex-direction: column; gap: 22px; padding-block: 16px 40px; }
section { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
h2 {
  margin: 0; font: 600 13px/1.2 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}
.notice {
  border-radius: 10px; padding: 10px 12px; font-size: 14px;
  background: var(--warn-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
}

.summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.summary .od { font: 700 34px/1 var(--display); letter-spacing: 0.03em; }
.summary .od span { color: var(--muted); font-weight: 500; padding-inline: 4px; }
.summary .facts { color: var(--muted); font-size: 14px; }
.summary .facts b { color: var(--ink); font-weight: 600; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }

/* Alerts */
.alerts { display: grid; gap: 8px; }
.alert {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--rare);
  border-radius: 10px; padding: 10px 12px; cursor: pointer;
}
.alert.gone { border-left-color: var(--line); }
.alert .what { font: 600 18px/1.15 var(--display); letter-spacing: 0.03em; }
.alert .when { color: var(--muted); font-size: 13px; }
.alert .pts { grid-row: span 2; font: 500 15px/1 var(--mono); text-align: right; }
.alert.gone .pts { color: var(--muted); font-family: var(--body); font-size: 13px; }

/* Calendar */
.months { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
.month { min-width: 0; }
.month h3 { margin: 0 0 6px; font: 600 18px/1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.dow { font-size: 11px; color: var(--muted); text-align: center; padding-bottom: 2px; }
.day {
  aspect-ratio: 1 / 1.05; max-width: 100%; border: 0; border-radius: 6px; padding: 3px 2px;
  display: flex; flex-direction: column; justify-content: space-between; align-items: center;
  background: transparent; color: var(--muted); font-size: 12px; line-height: 1;
}
.day .n { align-self: flex-start; padding-left: 2px; }
.day .p { font: 500 11px/1 var(--mono); font-variant-numeric: tabular-nums; }
.day.has { cursor: pointer; background: var(--plain); color: var(--ink); }
.day.match { background: var(--match-soft); color: var(--match); }
.day.match .p { font-weight: 500; }
.day.rare { background: var(--rare); color: var(--rare-ink); }
.day.fresh { box-shadow: inset 0 0 0 2px var(--accent); }
.day.out { opacity: 0.35; }
.day.today .n { text-decoration: underline; }

/* List */
.list { display: grid; gap: 6px; }
.row {
  display: grid; grid-template-columns: 5.5em 1fr auto; gap: 10px; align-items: center; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; cursor: pointer;
}
.row .d { font: 600 16px/1.1 var(--display); letter-spacing: 0.03em; }
.row .tags { display: flex; gap: 6px; flex-wrap: wrap; color: var(--muted); font-size: 12px; min-width: 0; }
.row .pts { font: 500 14px/1 var(--mono); }
.pill { border-radius: 999px; padding: 2px 7px; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; }
.pill.rare { background: var(--rare); color: var(--rare-ink); }
.pill.match { background: var(--match-soft); color: var(--match); }
.pill.new { background: var(--accent); color: var(--surface); }
.empty { color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 16px; }

/* Status */
.status-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; }
td.route-cell { font: 600 15px/1 var(--display); letter-spacing: 0.04em; }
td.fail { color: var(--warn); }
td.off { color: var(--muted); }

/* Day sheet */
dialog {
  border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 560px; max-height: 85vh;
  background: var(--surface); color: var(--ink); border-radius: 16px 16px 0 0;
}
dialog::backdrop { background: rgb(0 0 0 / 0.45); }
@media (min-width: 600px) { dialog { margin: auto; border-radius: 16px; } }
.sheet { display: flex; flex-direction: column; gap: 14px; padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)); }
.sheet-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.sheet-head h3 { margin: 0; font: 700 26px/1.05 var(--display); letter-spacing: 0.02em; }
.sheet-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.close { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; width: 34px; height: 34px; cursor: pointer; flex: none; }
.prog { display: flex; flex-direction: column; gap: 8px; }
.prog h4 { margin: 0; display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); font-weight: 500; }
.prog h4 b { color: var(--ink); font-weight: 600; font-size: 14px; }
.offer { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; display: grid; gap: 4px; }
.offer.sel { border-color: var(--accent); }
.offer .line1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.offer .cab { font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.offer .pts { font: 500 15px/1 var(--mono); white-space: nowrap; }
.offer .meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.book {
  display: block; text-align: center; text-decoration: none; font-weight: 600;
  background: var(--accent); color: var(--surface); border-radius: 10px; padding: 10px;
}
.hint { color: var(--muted); font-size: 12px; margin: 0; }

@media (prefers-reduced-motion: no-preference) {
  .day.has, .row, .alert { transition: transform 0.1s; }
  .day.has:active, .row:active, .alert:active { transform: scale(0.96); }
}
</style>
</head>

<header>
  <div class="wrap">
    <div class="top">
      <h1>Award Seats</h1>
      <div class="updated" id="updated"></div>
    </div>

    <div class="controls">
      <div class="seg" id="cabins" role="group" aria-label="Cabin"></div>
      <div class="seg" id="progs" role="group" aria-label="Program"></div>
      <div class="seg" id="views" role="group" aria-label="View"></div>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="notices"></div>
  <section id="alerts-section" hidden>
    <h2>Alerts in the last 30 days</h2>

  </section>
  <section>
    <div class="summary" id="summary"></div>
    <div class="legend" id="legend"></div>
    <div id="seats"></div>
  </section>
  <section>
    <h2>Last checked</h2>
    <div class="status-wrap"><table id="status"></table></div>
    <p class="hint">Velocity checks about 3 routes per day, so each route refreshes every 2–3 days. Always confirm on the airline site before transferring points.</p>
  </section>
</main>

const CABINS = ["Business", "PremiumEconomy", "Economy", "First"];
const CABIN_LABEL = { Business: "Business", PremiumEconomy: "Premium", Economy: "Economy", First: "First" };
// Dates that have already departed drop out, even if the data is a few days old.
const today = new Date().toLocaleDateString("sv-SE");
const seats = D.seats.map(([p, r, date, cabin, pts, tax, left, flights, f]) => ({
  p, r, date, cabin, pts, tax, left, flights, match: !!(f & 1), rare: !!(f & 2), fresh: !!(f & 4),
})).filter((s) => s.date >= today);

const store = {
  get(k) { try { return localStorage.getItem("award-seats:" + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("award-seats:" + k, v); } catch {} },
};

// ---------- formatting ----------
const utc = (d) => new Date(d + "T00:00:00Z");
const fmtDay = (d, opts) => utc(d).toLocaleDateString("en-AU", { timeZone: "UTC", ...opts });
const longDate = (d) => fmtDay(d, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
const shortDate = (d) => fmtDay(d, { weekday: "short", day: "numeric", month: "short" });
const k = (pts) => (pts >= 1000 ? (Math.round(pts / 100) / 10).toString() + "k" : String(pts));
const pts = (n) => n.toLocaleString("en-AU") + " pts";
const od = (ri) => D.routes[ri].split("-");
const routeLabel = (ri) => od(ri).join(" → ");
function ago(iso) {
  if (!iso) return "never";
  const days = Math.floor((Date.now() - Date.parse(iso)) / 86400000);
  if (days <= 0) return "today";
  if (days === 1) return "yesterday";
  return days + " days ago";
}
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [a, v] of Object.entries(attrs)) {
    if (a === "class") e.className = v;
    else if (a.startsWith("on")) e.addEventListener(a.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(a, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid);
  return e;
}
function bookingUrl(p, ri, date) {
  if (p === "QF") return D.links.QF;
  const [o, d] = od(ri);
  const [y, m, dd] = date.split("-");
  return D.links.VA.replace("XXO", o).replace("XXD", d).replaceAll("MM-DD-YYYY", `${m}-${dd}-${y}`);
}

// ---------- state ----------
const cabinsWithData = CABINS.filter((c) => c in D.rules || seats.some((s) => s.cabin === c));
const fromHash = D.routes.indexOf(decodeURIComponent(location.hash.slice(1)));
const state = {
  route: fromHash >= 0 ? fromHash : Math.max(0, D.routes.indexOf(store.get("route"))),
  cabin: cabinsWithData.includes(store.get("cabin")) ? store.get("cabin") : Object.keys(D.rules)[0] || "Business",
  prog: ["all", "QF", "VA"].includes(store.get("prog")) ? store.get("prog") : "all",
  view: store.get("view") === "list" ? "list" : "cal",
};

/** Best (cheapest) seat per date for a route in the chosen cabin and program. */
function days(ri, cabin = state.cabin) {
  const m = new Map();
  for (const s of seats) {
    if (s.r !== ri || s.cabin !== cabin || (state.prog !== "all" && s.p !== state.prog)) continue;
    const cur = m.get(s.date);
    if (!cur) m.set(s.date, { best: s, match: s.match, rare: s.rare, fresh: s.fresh && s.match });
    else {
      if (s.pts < cur.best.pts) cur.best = s;
      cur.match ||= s.match; cur.rare ||= s.rare; cur.fresh ||= s.fresh && s.match;
    }
  }
  return m;
}

// ---------- render ----------
function seg(id, options, key) {
  const box = document.getElementById(id);
  box.replaceChildren(...options.map(([value, label]) =>
    el("button", { "aria-pressed": String(state[key] === value), onclick: () => { state[key] = value; store.set(key, value); render(); } }, label)));
}

function renderHeader() {
  document.getElementById("updated").textContent = "Updated " +
    new Date(D.generatedAt).toLocaleString("en-AU", { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });

  document.getElementById("routes").replaceChildren(...D.routes.map((_, ri) => {
    const m = [...days(ri).values()];
    const rare = m.filter((d) => d.rare).length, match = m.filter((d) => d.match).length;
    return el("button", {
      class: "route", "aria-pressed": String(state.route === ri),
      onclick: () => { state.route = ri; store.set("route", D.routes[ri]); history.replaceState(null, "", "#" + D.routes[ri]); render(); },
    }, routeLabel(ri), match ? el("span", { class: "count" + (rare ? " rare" : ""), title: "days within your limit" }, String(match)) : null);
  }));
  document.querySelector('.route[aria-pressed="true"]')?.scrollIntoView({ block: "nearest", inline: "nearest" });

  seg("cabins", cabinsWithData.map((c) => [c, CABIN_LABEL[c]]), "cabin");
  seg("progs", [["all", "Both"], ["QF", "Qantas"], ["VA", "Velocity"]], "prog");
  seg("views", [["cal", "Calendar"], ["list", "List"]], "view");
}

function renderNotices() {
  const box = document.getElementById("notices");
  const notes = [];
  for (const [p, info] of Object.entries(D.programs)) {
    if (info.on) continue;
    const last = D.status.filter((s) => s.p === p && s.ok).map((s) => s.ok).sort().at(-1);
    notes.push(el("div", { class: "notice" },
      `${info.name} checks are paused.` + (last ? ` Its seats below are from ${shortDate(last.slice(0, 10))} and may be out of date.` : "")));
  }
  box.replaceChildren(...notes);
  box.hidden = !notes.length;
}

function renderAlerts() {
  const section = document.getElementById("alerts-section");
  section.hidden = !D.alerts.length;
  document.getElementById("alerts").replaceChildren(...D.alerts.map((a) => {
    const now = seats.filter((s) => s.p === a.p && s.r === a.r && s.date === a.date && s.cabin === a.cabin);
    const best = now.length ? Math.min(...now.map((s) => s.pts)) : null;
    return el("button", {
      class: "alert" + (best == null ? " gone" : ""),
      onclick: () => { state.route = a.r; state.cabin = a.cabin; render(); openDay(a.r, a.date); },
    },
      el("div", { class: "what" }, `${routeLabel(a.r)} · ${shortDate(a.date)}`),
      el("div", { class: "pts" }, best == null ? "No longer showing" : k(best)),
      el("div", { class: "when" }, `${CABIN_LABEL[a.cabin]}, ${D.programs[a.p].name} · alerted ${ago(a.at)}`));
  }));
}

function renderSummary(m) {
  const vals = [...m.values()];
  const match = vals.filter((d) => d.match).length, rare = vals.filter((d) => d.rare).length;
  const rule = D.rules[state.cabin];
  const [o, d] = od(state.route);
  const facts = rule
    ? [el("b", {}, String(match)), ` ${CABIN_LABEL[state.cabin]} day${match === 1 ? "" : "s"} at or under ${k(rule)}`,
       rare ? [" · ", el("b", {}, String(rare)), " rare"] : null]
    : [el("b", {}, String(vals.length)), ` ${CABIN_LABEL[state.cabin]} reward day${vals.length === 1 ? "" : "s"}`];
  document.getElementById("summary").replaceChildren(
    el("div", { class: "od" }, o, el("span", {}, "→"), d),
    el("div", { class: "facts" }, ...facts));

  const item = (bg, text, extra = "") => el("span", {}, el("i", { style: `background:${bg};${extra}` }), text);
  document.getElementById("legend").replaceChildren(
    item("var(--rare)", "Rare (would alert)"),
    rule ? item("var(--match-soft)", `Within ${k(rule)}`) : null,
    item("var(--plain)", rule ? "Reward seat, over limit" : "Reward seat"),
    item("transparent", "New this check", "box-shadow: inset 0 0 0 2px var(--accent)"));
}

function renderCalendar(m) {
  const from = today > D.window[0] ? today : D.window[0], to = D.window[1];
  const months = [];
  for (let c = utc(from.slice(0, 7) + "-01"); c <= utc(to); c.setUTCMonth(c.getUTCMonth() + 1)) {
    const y = c.getUTCFullYear(), mo = c.getUTCMonth();
    const first = new Date(Date.UTC(y, mo, 1));
    const lead = (first.getUTCDay() + 6) % 7; // Monday first
    const len = new Date(Date.UTC(y, mo + 1, 0)).getUTCDate();
    const cells = ["M", "T", "W", "T", "F", "S", "S"].map((x) => el("div", { class: "dow", "aria-hidden": "true" }, x));
    for (let i = 0; i < lead; i++) cells.push(el("div"));
    for (let dnum = 1; dnum <= len; dnum++) {
      const date = `${y}-${String(mo + 1).padStart(2, "0")}-${String(dnum).padStart(2, "0")}`;
      const info = m.get(date);
      const cls = ["day"];
      if (date < from || date > to) cls.push("out");
      if (date === today) cls.push("today");
      if (info) cls.push("has", info.rare ? "rare" : info.match ? "match" : "plain");
      if (info?.fresh) cls.push("fresh");
      cells.push(el("button", {
        class: cls.join(" "), disabled: !info,
        "aria-label": info ? `${longDate(date)}, from ${pts(info.best.pts)}` : longDate(date),
        onclick: info ? () => openDay(state.route, date) : null,
      }, el("span", { class: "n" }, String(dnum)), el("span", { class: "p" }, info ? k(info.best.pts) : "")));
    }
    months.push(el("div", { class: "month" },
      el("h3", {}, first.toLocaleDateString("en-AU", { timeZone: "UTC", month: "long", year: "numeric" })),
      el("div", { class: "grid" }, cells)));
  }
  return el("div", { class: "months" }, months);
}

function renderList(m) {
  const entries = [...m.entries()].sort(([a], [b]) => a.localeCompare(b));
  if (!entries.length) return el("div", { class: "empty" }, `No ${CABIN_LABEL[state.cabin]} reward seats on this route in the latest check.`);
  return el("div", { class: "list" }, entries.map(([date, info]) =>
    el("button", { class: "row", onclick: () => openDay(state.route, date) },
      el("div", { class: "d" }, shortDate(date)),
      el("div", { class: "tags" },
        info.rare ? el("span", { class: "pill rare" }, "Rare") : info.match ? el("span", { class: "pill match" }, "Within limit") : null,
        info.fresh ? el("span", { class: "pill new" }, "New") : null,
        el("span", {}, D.programs[info.best.p].name)),
      el("div", { class: "pts" }, k(info.best.pts)))));
}

function renderStatus() {
  const progs = Object.keys(D.programs);
  const head = el("tr", {}, el("th", {}, "Route"), progs.map((p) => el("th", {}, D.programs[p].name)));
  const rows = D.routes.map((_, ri) => el("tr", {},
    el("td", { class: "route-cell" }, routeLabel(ri)),
    progs.map((p) => {
      const s = D.status.find((x) => x.p === p && x.r === ri);
      if (!s || !s.at) return el("td", { class: "off" }, D.programs[p].on ? "Not yet" : "Off");
      if (s.err) return el("td", { class: "fail", title: s.err }, `Failed ${ago(s.at)}` + (s.ok ? ` · ok ${ago(s.ok)}` : ""));
      return el("td", { class: D.programs[p].on ? "" : "off" }, ago(s.ok));
    })));
  document.getElementById("status").replaceChildren(el("thead", {}, head), el("tbody", {}, rows));
}

function openDay(ri, date) {
  const all = seats.filter((s) => s.r === ri && s.date === date)
    .sort((a, b) => CABINS.indexOf(a.cabin) - CABINS.indexOf(b.cabin) || a.pts - b.pts);
  const groups = Object.keys(D.programs).map((p) => [p, all.filter((s) => s.p === p)]).filter(([, list]) => list.length);
  const checked = (p) => D.status.find((s) => s.p === p && s.r === ri)?.ok;

  const body = document.getElementById("sheet-body");
  body.replaceChildren(...[
    el("div", { class: "sheet-head" },
      el("div", {}, el("h3", {}, `${routeLabel(ri)}`), el("p", {}, longDate(date))),
      el("button", { class: "close", "aria-label": "Close", onclick: () => sheet.close() }, "✕")),
    groups.map(([p, list]) => el("div", { class: "prog" },

      list.map((s) => el("div", { class: "offer" + (s.cabin === state.cabin ? " sel" : "") },
        el("div", { class: "line1" },

            s.rare ? el("span", { class: "pill rare" }, "Rare") : s.match ? el("span", { class: "pill match" }, "Within limit") : null,
            s.fresh ? el("span", { class: "pill new" }, "New") : null),
          el("div", { class: "pts" }, pts(s.pts))),
        el("div", { class: "meta" }, [
          s.tax != null ? `+ $${Math.round(s.tax)} tax` : null,
          s.left != null ? `${s.left} seat${s.left === 1 ? "" : "s"} left` : null,
        ].filter(Boolean).join(" · ")),
        el("div", { class: "meta" }, s.flights || "Cheapest fare that day; open the search to see flights."))),
      el("a", { class: "book", href: bookingUrl(p, ri, date), target: "_blank", rel: "noopener" },
        p === "VA" ? "Search this date on Velocity" : "Open Qantas Reward Finder"))),
    el("p", { class: "hint" }, "Seats change quickly. Confirm on the airline site before transferring points."),
  ].flat());
  if (!sheet.open) sheet.showModal();
}

const sheet = document.getElementById("sheet");
sheet.addEventListener("click", (e) => { if (e.target === sheet) sheet.close(); });
window.addEventListener("hashchange", () => {
  const ri = D.routes.indexOf(decodeURIComponent(location.hash.slice(1)));
  if (ri >= 0 && ri !== state.route) { state.route = ri; render(); }
});

function render() {
  renderHeader();
  renderNotices();
  renderAlerts();
  const m = days(state.route);
  renderSummary(m);
  document.getElementById("seats").replaceChildren(state.view === "list" ? renderList(m) : renderCalendar(m));
  renderStatus();
}
render();
</script>
</body>
</html>
